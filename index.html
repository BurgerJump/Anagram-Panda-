<div class="game">

<h1>ANAGRAM 🐼 PANDA</h1>

<div class="topBar">

<div class="timer">
⏳️
<span id="time">
90
</span>
</div>

0
</span>

class="wordSlots">

</div>

<div id="letters"
class="lettersGrid">

</div>

<div class="buttons">

<button onclick="deleteLetter()">
DELETE
</button>

<button onclick="shuffleLetters()">
SHUFFLE
</button>

<button onclick="clearWord()">
CLEAR
</button>

</div>

<button
class="submitBtn"
onclick="submitWord()">

SUBMIT

</button>

class="message">
</div>

</button>

</div>
