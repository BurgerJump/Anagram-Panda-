<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">



<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-QW52EWJVKH"></script>

<script>
window.dataLayer = window.dataLayer || [];

function gtag(){
  dataLayer.push(arguments);
}

gtag('js', new Date());
gtag('config', 'G-QW52EWJVKH');
</script>

<title>Anagram Panda</title>

<meta
name="description"
content="Anagram Panda is a fast 9-letter word puzzle game. Find the best word you can before the 90-second timer runs out.">

<link rel="stylesheet" href="home.css">

<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#806348">
</head>


<body>

<main class="home">









<!-- LOGO -->





<section class="hero">




<div class="titleArea">

<a
href="game.html"
class="gameLogo">

<img
src="logo.png"
alt="Anagram Panda">

</a>

</div>


<!-- HOW TO PLAY -->

<section
class="howToPlay"
id="howToPlay">

<div class="sectionHeader">

<div class="sectionTitle">
Type the word
</div>



<!-- MENU BUTTON -->

<button
class="menuBtn"
id="menuBtn"
aria-label="Open menu"
aria-expanded="false">
&#9776;

</button>

<nav
class="menuPanel"
id="menuPanel"
aria-hidden="true">

<div class="menuTitle">
MENU
</div>





<button
type="button"
id="audioBtn">
AUDIO
<span id="audioState">ON</span>
</button>

<button
type="button"
id="vibrationBtn">
VIBRATION
<span id="vibrationState">ON</span>
</button>

<a href="about.html">
ABOUT/CONTACT
</a>


<button
type="button"
id="shareBtn">
SHARE GAME
</button>

<button
  type="button"
  id="installBtn">
  INSTALL APP
</button>

<a href="privacy.html">
PRIVACY POLICY
</a>

</nav>


</div>

<div class="howVisual">

<img
src="demo.gif"
class="howBackground"
alt="Anagram Panda gameplay demo">


</div>


<div class="howHeadline">
9 LETTERS. 90 SECONDS. FIND THE LONGEST WORD.
</div>


<div class="howSteps">
Tap letters, Build a word & Submit
</div>

</section>


<!-- PLAY -->

<a
href="game.html"
class="playBtn">

PLAY

</a>


<!-- HIGHEST -->

<section class="quickInfo">

<div class="highestRow">
HIGHSCORE: <strong id="highScore">0</strong>
</div>

</section>


</div>

</section>


</section>


<script>

/* ========================= */
/* MENU */
/* ========================= */

const menuBtn =
document.getElementById("menuBtn");

const menuPanel =
document.getElementById("menuPanel");


menuBtn.addEventListener(
"click",
function(){

const opened =
menuPanel.classList.toggle("open");

menuBtn.setAttribute(
"aria-expanded",
opened
);

menuPanel.setAttribute(
"aria-hidden",
!opened
);

}
);


/* Close menu when selecting a link */

menuPanel
.querySelectorAll("a")
.forEach(function(link){

link.addEventListener(
"click",
function(){

menuPanel.classList.remove("open");

menuBtn.setAttribute(
"aria-expanded",
"false"
);

menuPanel.setAttribute(
"aria-hidden",
"true"
);

}
);
});


/* ========================= */
/* SHARE */
/* ========================= */

const shareBtn =
document.getElementById("shareBtn");


shareBtn.addEventListener(
"click",
async function(){

const shareData = {

title:
"Anagram Panda",

text:
"Can You Beat the Panda? Try Anagram Panda!",

url:
window.location.origin

};


if(navigator.share){

try{

await navigator.share(
shareData
);

}catch(error){

}

}else{

try{

await navigator.clipboard.writeText(
window.location.origin
);

shareBtn.textContent =
"LINK COPIED";

setTimeout(
function(){

shareBtn.textContent =
"SHARE GAME";

},
1600
);

}catch(error){

}

}

}
);


/* ========================= */
/* AUDIO SETTING */
/* ========================= */

const audioBtn =
document.getElementById("audioBtn");

const audioState =
document.getElementById("audioState");


let audioEnabled =
localStorage.getItem("audioEnabled");


if(audioEnabled === null){

audioEnabled = "true";

localStorage.setItem(
"audioEnabled",
"true"
);

}


function updateAudio(){

audioState.textContent =
audioEnabled === "true"
? "ON"
: "OFF";

}


updateAudio();


audioBtn.addEventListener(
"click",
function(){

audioEnabled =
audioEnabled === "true"
? "false"
: "true";

localStorage.setItem(
"audioEnabled",
audioEnabled
);

updateAudio();

}
);


/* ========================= */
/* VIBRATION SETTING */
/* ========================= */

const vibrationBtn =
document.getElementById("vibrationBtn");

const vibrationState =
document.getElementById("vibrationState");


let vibrationEnabled =
localStorage.getItem("vibrationEnabled");


if(vibrationEnabled === null){

vibrationEnabled = "true";

localStorage.setItem(
"vibrationEnabled",
"true"
);

}


function updateVibration(){

vibrationState.textContent =
vibrationEnabled === "true"
? "ON"
: "OFF";

}


updateVibration();


vibrationBtn.addEventListener(
"click",
function(){

vibrationEnabled =
vibrationEnabled === "true"
? "false"
: "true";

localStorage.setItem(
"vibrationEnabled",
vibrationEnabled
);

updateVibration();

}
);


/* ========================= */
/* HIGH SCORE */
/* ========================= */

const highScore =
localStorage.getItem("highScore") || "—";

const highScoreWord =
localStorage.getItem("highScoreWord") || "—";

const highScoreDate =
localStorage.getItem("highScoreDate") || "—";


document.getElementById(
"highScore"
).textContent =
highScore;


document.getElementById(
"highScoreWord"
).textContent =
highScoreWord;


document.getElementById(
"highScoreDate"
).textContent =
highScoreDate;

</script>


</main>

</body>

</html>
