</footer><script>

/*
  MIGRATION FROM OLD SCORING SYSTEM

  The old 5000-point score was cumulative.
  The new High Score is based on ONE SINGLE WORD.

  This flag makes sure the old score is deleted only once.
*/

if(
  localStorage.getItem("highScoreMigration") !== "done"
){

  localStorage.removeItem("highScore");
  localStorage.removeItem("highScoreWord");
  localStorage.removeItem("highScoreDate");

  localStorage.setItem(
    "highScoreMigration",
    "done"
  );

}


/* ========================= */
/* NEW HIGH SCORE */
/* ========================= */

const highScore =
  localStorage.getItem("highScore") || "—";

const highScoreWord =
  localStorage.getItem("highScoreWord") || "—";

const highScoreDate =
  localStorage.getItem("highScoreDate") || "—";


document.getElementById("highScore").textContent =
  highScore;

document.getElementById("highScoreWord").textContent =
  highScoreWord;

document.getElementById("highScoreDate").textContent =
  highScoreDate;

</script></main></body></html>
