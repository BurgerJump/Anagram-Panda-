<html lang="en">

<head>

<meta charset="UTF-8">

name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap"
rel="stylesheet">

<title>Anagram Panda</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#806348">

<body>

<div class="game">


<!-- =====================================================
     LOGO
===================================================== -->

<a
href="index.html"
class="gameLogo">

<img
src="logo.png"
alt="Anagram Panda">

</a>


<!-- =====================================================
     TOP BAR
===================================================== -->

<div class="topBar">

  <div class="scoreBox pointsBox">
    <span class="scoreLabel">POINTS</span>
    <span id="score">0</span>
  </div>

  <div class="scoreBox highBox">
    <span class="scoreLabel">HIGH</span>
    <span id="highScore">0</span>
  </div>

  <button
    class="menuBtn"
    id="menuBtn"
    type="button"
    aria-label="Open menu"
    aria-expanded="false">

    ☰

  </button>

</div>

<!-- =====================================================
     MENU
===================================================== -->

<nav
class="menuPanel"
id="menuPanel"
aria-hidden="true">

  <div class="menuTitle">
    MENU
  </div>

  <button
    type="button"
    id="audioBtn">

    AUDIO
    <span id="audioState">ON</span>

  </button>

  <button
    type="button"
    id="vibrationBtn">

    VIBRATION
    <span id="vibrationState">ON</span>

  </button>

  <a href="about.html">
    ABOUT/CONTACT
  </a>

  <button
    type="button"
    id="shareBtn">

    SHARE GAME

  </button>

  <a href="privacy.html">
    PRIVACY POLICY
  </a>

</nav>


<!-- =====================================================
     WORD SLOTS
===================================================== -->

<div
id="wordSlots"
class="wordSlots">
</div>


<!-- =====================================================
     LETTER GRID
===================================================== -->

<div
id="letters"
class="lettersGrid">
</div>


<!-- =====================================================
     ACTION BUTTONS
===================================================== -->

<div class="buttons">

  <button
    id="deleteBtn"
    type="button"
    onclick="deleteLetter()">

    DELETE

  </button>

  <button
    id="shuffleBtn"
    type="button"
    onclick="shuffleLetters()">

    SHUFFLE

  </button>

  <button
    id="clearBtn"
    type="button"
    onclick="clearWord()">

    CLEAR

  </button>

</div>


<!-- =====================================================
     SUBMIT
===================================================== -->

<button
class="submitBtn"
id="submitBtn"
type="button"
onclick="submitWord()">

SUBMIT

</button>


<!-- =====================================================
     MESSAGE
===================================================== -->

<div
id="message"
class="message"
aria-live="polite">

TIME 90<br>
ROUND 1 OF 3

</div>


<!-- =====================================================
     NEXT ROUND / NEW GAME
===================================================== -->

<button
class="restartBtn"
id="roundBtn"
type="button">

NEXT ROUND

</button>
</div>


<!-- =====================================================
     FINAL POPUP
===================================================== -->

<div
id="finalPopup"
class="popupOverlay"
style="display:none;">

  <div class="finalPopup">

    <div class="popupTitle">
      GAME COMPLETE
    </div>

    <div class="finalScores">

      <div>
        ROUND 1
        <span id="finalRound1">0</span>
      </div>

      <div>
        ROUND 2
        <span id="finalRound2">0</span>
      </div>

      <div>
        ROUND 3
        <span id="finalRound3">0</span>
      </div>

      <div>
        BONUS
        <span id="finalBonus">0</span>
      </div>

      <div class="finalTotal">
        TOTAL
        <span id="finalTotal">0</span>
      </div>

    </div>

    <div
    id="newHighScore"
    class="newHighScore"
    style="display:none;">

      NEW HIGH SCORE

    </div>

    <button
    class="popupButton"
    type="button"
    onclick="startNewGame()">

      NEW GAME

    </button>

  </div>

</div>


<!-- =====================================================
     BASIC SETTINGS / MENU
===================================================== -->

<script>

const menuBtn =
document.getElementById("menuBtn");

const menuPanel =
document.getElementById("menuPanel");


menuBtn.addEventListener(
"click",
function(){

  const opened =
  menuPanel.classList.toggle("open");

  menuBtn.setAttribute(
    "aria-expanded",
    opened
  );

  menuPanel.setAttribute(
    "aria-hidden",
    !opened
  );

}
);


document.addEventListener(
"click",
function(event){

  if(
    !menuPanel.contains(event.target) &&
    event.target !== menuBtn
  ){

    menuPanel.classList.remove("open");

    menuBtn.setAttribute(
      "aria-expanded",
      "false"
    );

    menuPanel.setAttribute(
      "aria-hidden",
      "true"
    );

  }

}
);


/* AUDIO */

const audioBtn =
document.getElementById("audioBtn");

const audioState =
document.getElementById("audioState");

let audioEnabled =
localStorage.getItem("audioEnabled");


if(audioEnabled === null){

  audioEnabled = "true";

  localStorage.setItem(
    "audioEnabled",
    "true"
  );

}


function updateAudio(){

  audioState.textContent =
  audioEnabled === "true"
  ? "ON"
  : "OFF";

}

updateAudio();


audioBtn.addEventListener(
"click",
function(){

  audioEnabled =
  audioEnabled === "true"
  ? "false"
  : "true";

  localStorage.setItem(
    "audioEnabled",
    audioEnabled
  );

  updateAudio();

}
);


/* VIBRATION */

const vibrationBtn =
document.getElementById("vibrationBtn");

const vibrationState =
document.getElementById("vibrationState");

let vibrationEnabled =
localStorage.getItem("vibrationEnabled");


if(vibrationEnabled === null){

  vibrationEnabled = "true";

  localStorage.setItem(
    "vibrationEnabled",
    "true"
  );

}


function updateVibration(){

  vibrationState.textContent =
  vibrationEnabled === "true"
  ? "ON"
  : "OFF";

}

updateVibration();


vibrationBtn.addEventListener(
"click",
function(){

  vibrationEnabled =
  vibrationEnabled === "true"
  ? "false"
  : "true";

  localStorage.setItem(
    "vibrationEnabled",
    vibrationEnabled
  );

  updateVibration();

}
);


/* SHARE */

const shareBtn =
document.getElementById("shareBtn");


shareBtn.addEventListener(
"click",
async function(){

  const shareData = {

    title:
    "Anagram Panda",

    text:
    "Can You Beat the Panda? Try Anagram Panda!",

    url:
    window.location.origin

  };


  if(navigator.share){

    try{

      await navigator.share(
        shareData
      );

    }catch(error){

    }

  }else{

    try{

      await navigator.clipboard.writeText(
        window.location.origin
      );

      shareBtn.textContent =
      "LINK COPIED";

      setTimeout(
        function(){

          shareBtn.textContent =
          "SHARE GAME";

        },
        1600
      );

    }catch(error){

    }

  }

});


/* HIGH SCORE */

const savedHighScore =
localStorage.getItem("highScore") || "0";

document.getElementById(
"highScore"
).textContent =
savedHighScore;

</script>


<!-- GAME SCRIPT -->

<script src="script.js"></script>


<style>

/* =====================================================
   GAME BACKGROUND — SAME AS HOME
===================================================== */

html{
-webkit-text-size-adjust:100%;
text-size-adjust:100%;
}

*{
box-sizing:border-box;
}

html,
body{
margin:0;
padding:0;
width:100%;
height:100%;
}

body{

overflow:hidden;

font-family:"Nunito", Arial, sans-serif;

color:#efe4cd;

background:
linear-gradient(
rgba(214,181,130,0.82),
rgba(202,165,112,0.38)
),
url("background.png");

background-size:cover;
background-position:center;
background-attachment:fixed;
background-repeat:no-repeat;

}


/* =====================================================
   GAME CONTAINER
===================================================== */



/* =====================================================
   LOGO — SAME AS HOME
===================================================== */

.gameLogo{

display:block;

width:100%;

margin:0 0 8px;

border-radius:18px;

overflow:hidden;

flex-shrink:0;

line-height:0;

}

.gameLogo img{

display:block;

width:100%;
height:auto;

border-radius:18px;

}


/* =====================================================
   TOP BAR
===================================================== */

.topBar{

position:relative;

width:100%;

min-height:48px;

display:grid;

grid-template-columns:1fr 1fr 48px;

align-items:center;

margin:0 0 6px;

flex-shrink:0;

}


.points,
.high{

line-height:1;

color:#06140b;

white-space:nowrap;

}

.points{

text-align:left;

}

.high{

text-align:center;

}

.points span,
.high span{

margin-left:10px;

}


/* =====================================================
   MENU BUTTON
===================================================== */

.menuBtn{

width:48px;
height:48px;

margin:0;
padding:0;

display:flex;

align-items:center;
justify-content:center;

border:none;

border-radius:14px;

background:rgba(239,228,205,0.94);

color:#4b3b2c;

font-family:inherit;

font-size:27px;

font-weight:900;

line-height:1;

box-shadow:
0 5px 0 #a68d6d,
0 8px 14px rgba(0,0,0,0.18);

z-index:1001;

cursor:pointer;

}

.menuBtn:active{

transform:translateY(4px);

box-shadow:
0 2px 0 #a68d6d,
0 4px 8px rgba(0,0,0,0.16);

}


/* =====================================================
   MENU PANEL
===================================================== */

.menuPanel{

position:absolute;

top:calc(
8px +
env(safe-area-inset-top) +
72px
);

right:8px;

width:min(
270px,
calc(100vw - 24px)
);

padding:12px;

display:flex;

flex-direction:column;

gap:8px;

background:rgba(239,228,205,0.98);

border:
2px solid
rgba(87,68,48,0.20);

border-radius:18px;

box-shadow:
0 12px 30px rgba(0,0,0,0.25);

z-index:1002;

transform:
translateY(-8px)
scale(.96);

opacity:0;

pointer-events:none;

transition:
opacity .15s ease,
transform .15s ease;

}

.menuPanel.open{

opacity:1;

transform:
translateY(0)
scale(1);

pointer-events:auto;

}

.menuTitle{

padding:
8px
6px
12px;

font-size:18px;

font-weight:900;

letter-spacing:1px;

color:#4b3b2c;

}

.menuPanel a,
.menuPanel button{

width:100%;

min-height:44px;

display:flex;

align-items:center;

justify-content:flex-start;

padding:
9px
13px;

border:none;

border-radius:12px;

background:#806348;

color:#efe4cd;

font-family:inherit;

font-size:15px;

font-weight:800;

text-align:left;

box-shadow:
0 4px 0 #59432f,
0 6px 10px rgba(0,0,0,0.15);

cursor:pointer;

text-decoration:none;

}

.menuPanel a:active,
.menuPanel button:active{

transform:translateY(3px);

box-shadow:
0 1px 0 #59432f,
0 3px 6px rgba(0,0,0,0.12);

}


/* =====================================================
   WORD SLOTS
===================================================== */

.wordSlots{

min-height:43px;

height:43px;

margin:
1px
0
4px;

display:flex;

align-items:center;

justify-content:center;

gap:5px;

flex-shrink:0;

}


/* =====================================================
   LETTER GRID
===================================================== */

.lettersGrid{

width:100%;

display:grid;

grid-template-columns:
repeat(3,minmax(0,1fr));

gap:8px;

flex-shrink:0;

}


.letterBtn{

width:100%;

aspect-ratio:1/.64;


border:0;

border-radius:10px;

background:#5f6b4a;

color:#efe4cd;

font-family:"Nunito",Arial,sans-serif;

font-size:
clamp(
27px,
8vw,
39px
);

font-weight:900;

box-shadow:
inset 0 -3px 0 rgba(0,0,0,.13);

touch-action:manipulation;

}

.letterBtn:active{

transform:translateY(3px);

}


/* =====================================================
   ACTION BUTTONS
===================================================== */

.buttons{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:6px;

margin-top:6px;

flex-shrink:0;

}

.buttons button{

height:20px;

border:0;

border-radius:8px;

background:#806348;

color:#efe4cd;

font-family:inherit;

font-size:14px;

font-weight:900;

touch-action:manipulation;

}

.buttons button:active{

transform:translateY(2px);

}


/* =====================================================
   SUBMIT
===================================================== */

.submitBtn{

width:100%;

height:38px;

margin-top:6px;

border:0;

border-radius:9px;

background:#a67c52;

color:#efe4cd;

font-family:inherit;

font-size:14px;

font-weight:900;

flex-shrink:0;

}

.submitBtn:active{

transform:translateY(2px);

}


/* =====================================================
   MESSAGE
===================================================== */

.message{

width:100%;

flex:1 1 0;
min-height:0;

height:auto;
max-height:none;

margin:0;

padding:8px;

border-radius:8px;

background:rgba(239,228,205,.75);

color:#46533a;

font-size:15px;

font-weight:800;

line-height:1.35;

text-align:center;

overflow:hidden;

}


/* =====================================================
   NEXT ROUND
===================================================== */

.restartBtn{

width:100%;

height:38px;

margin:0;

border:0;

border-radius:9px;

background:#72543d;

color:#efe4cd;

font-family:inherit;

font-size:14px;

font-weight:900;

flex-shrink:0;

}

.restartBtn:active{

transform:translateY(2px);

}


/* =====================================================
   POPUP
===================================================== */

.popupOverlay{

position:fixed;

inset:0;

z-index:100;

background:rgba(40,45,32,.58);

display:flex;

align-items:center;

justify-content:center;

padding:20px;

}

.finalPopup{

width:min(360px,100%);

padding:
18px;

border-radius:14px;

background:#efe4cd;

color:#46533a;

box-shadow:
0 12px 35px rgba(0,0,0,.25);

}

.popupTitle{

text-align:center;

font-size:20px;

font-weight:900;

margin-bottom:12px;

}

.finalScores{

display:flex;

flex-direction:column;

gap:5px;

font-size:14px;

font-weight:800;

}

.finalScores div{

display:flex;

justify-content:space-between;

}

.finalScores span{

font-weight:900;

}

.finalTotal{

margin-top:5px;

padding-top:7px;

border-top:2px solid #806348;

font-size:17px;

}

.newHighScore{

margin-top:9px;

text-align:center;

color:#a8473c;

font-size:14px;

font-weight:900;

}

.popupButton{

width:100%;

height:40px;

margin-top:13px;

border:0;

border-radius:9px;

background:#596b45;

color:#efe4cd;

font-family:inherit;

font-size:14px;

font-weight:900;

}

.popupButton:active{

transform:translateY(2px);

}





</style>

</body>

</html>
